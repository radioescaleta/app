<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radioescaleta - Tus programas de radio escolares</title>
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/index.css">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <header>
        <div class="logo">
            <i class="fa-solid fa-radio"></i> Radioescaleta
        </div>
        <div id="userProfile" class="hidden">
            <span id="userName">Usuario</span>
            <button id="btnLogout" class="btn btn-secondary">Cerrar Sesión</button>
        </div>
    </header>

    <main class="container">
        <section id="loginSection" class="hero">
            <h1>Bienvenido a Radioescaleta</h1>
            <p>Crea, organiza y lanza tus programas de radio de forma profesional.</p>
            <br>
            <button id="btnLogin" class="btn btn-primary"><i class="fa-brands fa-google"></i> Iniciar sesión con Google</button>
        </section>

        <section id="dashboardSection" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>Mis Programas</h2>
                <button id="btnNewProgram" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Nueva Escaleta</button>
            </div>
            
            <div class="programs-grid" id="programsList">
                <!-- Los programas se cargarán aquí dinámicamente -->
            </div>
        </section>
    </main>

    <!-- Scripts (Módulos JS) -->
    <script type="module" src="./js/index.js?v=2"></script>
    <footer style="text-align: center; padding: 20px; background: white; border-top: 1px solid #ddd; margin-top: 50px;">
        <p><a href="privacidad.html" style="color: var(--secondary-color);">Política de Privacidad</a> | <a href="terminos.html" style="color: var(--secondary-color);">Términos de Uso</a></p>
        <p style="margin-top: 10px; font-size: 0.9em; color: #666;">
            <a rel="license" href="http://creativecommons.org/licenses/by-nc-sa/4.0/"><img alt="Licencia de Creative Commons" style="border-width:0; vertical-align: middle; margin-right: 5px;" src="https://i.creativecommons.org/l/by-nc-sa/4.0/88x31.png" /></a><br />Este obra está bajo una <a rel="license" href="http://creativecommons.org/licenses/by-nc-sa/4.0/" style="color: #666;">licencia de Creative Commons Reconocimiento-NoComercial-CompartirIgual 4.0 Internacional</a>.
        </p>
    </footer>
</body>
</html>
