<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudio en Directo — Radioescaleta</title>
    <link rel="stylesheet" href="./css/common.css?v=12">
    <link rel="stylesheet" href="./css/studio.css?v=6">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="studio-body">

    <header>
        <div class="logo">
            <a href="javascript:history.back()" style="color: inherit; text-decoration: none;">
                <i class="fa-solid fa-arrow-left"></i> <i class="fa-solid fa-radio"></i> Radioescaleta
            </a>
        </div>
        <div class="title-wrapper" style="text-align: center;">
            <span id="programTitle" style="font-size: 20px; font-weight: bold;">Cargando…</span>
        </div>
        <div id="userProfileDropdown" class="profile-dropdown">
            <img src="" alt="Avatar" class="avatar-img" id="userAvatar">
            <span class="profile-name" id="userNameLabel">Usuario</span>
            <i class="fa-solid fa-chevron-down" style="font-size: 10px; color: #888;"></i>
            <div class="profile-menu">
                <a class="profile-menu-item" id="btnEditProfile">
                    <i class="fa-solid fa-user-pen" style="width: 20px;"></i> Modificar perfil
                </a>
                <a class="profile-menu-item danger" id="btnLogout">
                    <i class="fa-solid fa-right-from-bracket" style="width: 20px;"></i> Cerrar sesión
                </a>
            </div>
        </div>
    </header>

    <div class="studio-layout">

        <!-- ROW 1: Cronómetro + Mesa de mezcla -->
        <div id="studio-top-row">

            <!-- Cronómetro -->
            <div id="studioTimer">
                <div id="onAirBadge">ON AIR</div>
                <span id="studioTimerDisplay">00:00</span>
                <div class="timer-controls">
                    <button id="btnTimerPlay" class="btn-timer-play" title="Iniciar / Pausar">
                        <i class="fa-solid fa-play" style="margin-left:4px;"></i>
                    </button>
                    <button id="btnTimerReset" class="btn-timer-reset" title="Detener y reiniciar">
                        <i class="fa-solid fa-stop"></i>
                    </button>
                </div>
                <button id="btnRecordPodcast" class="btn-rec" title="Grabar todo lo que suena en esta pestaña">
                    <i class="fa-solid fa-circle-dot"></i> REC
                </button>
            </div>

            <!-- Mesa de mezcla (generada por JS) -->
            <div id="studio-mixer">
                <div class="mixer-title"><i class="fa-solid fa-sliders" style="color:#f06292;margin-right:6px;"></i>Mesa de mezcla</div>
                <div class="mixer-channels" id="mixerChannels">
                    <!-- Faders generados por studio.js -->
                </div>
            </div>

        </div>

        <!-- ROW 2: Botonera -->
        <div id="studio-board-row">
            <h3><i class="fa-solid fa-headphones"></i> Sonidos</h3>
            <div class="audio-buttons-container" id="audioBoard">
                <!-- Botones generados por studio.js -->
            </div>
        </div>

        
        <!-- ROW 2.5: Text Reader (hidden by default) -->
        <div id="studio-text-reader-row" style="display: none;">
            <div class="text-reader-header">
                <div>
                    <i class="fa-solid fa-microphone" style="color:#00acc1;"></i> <b style="color:#00838f;">Texto en Antena</b>
                </div>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <select id="textReaderVoice" style="padding: 4px; border-radius: 5px; border: 1px solid #ccc; font-size: 12px; max-width: 150px;"></select>
                    <button id="btnTextReaderPlay" class="btn btn-primary" style="padding: 5px 12px; font-size: 12px; border-radius: 15px; background: #4caf50; border: none; display: flex; align-items: center; gap: 5px; color: white; cursor: pointer;">
                        <i class="fa-solid fa-play"></i> Leer
                    </button>
                    <button id="btnTextReaderClose" style="background: none; border: none; font-size: 16px; color: #888; cursor: pointer; margin-left: 10px;">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>
            <div id="textReaderContent">
            </div>
        </div>

        <!-- ROW 3: Escaleta (solo lectura) -->
        <div id="studio-escaleta-row">
            <div id="studioEscaleta">
                <p style="text-align:center;color:#888;">Cargando escaleta…</p>
            </div>
        </div>

    </div>

    <audio id="globalAudioPlayer" style="display:none;"></audio>

    <script type="module" src="./js/studio.js?v=8"></script>
</body>
</html>
